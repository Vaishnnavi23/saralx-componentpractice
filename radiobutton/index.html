<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARIA Radio Group – aria-activedescendant</title>

<style>
  [role="radiogroup"] {
    margin-bottom: 1.5rem;
    outline: none;
  }

  .group-heading {
    margin-bottom: 1rem;
  }

  .radio {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 200px;
    padding: 6px 8px;
    margin-bottom: 0.75rem;
    border-radius: 5px;
    cursor: pointer;
  }

  .radio-ui {
    width: 18px;
    height: 16px;
    border: 2px solid #005a9c;
    border-radius: 50%;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .radio[aria-checked="true"] .radio-ui {
    background-color: #005a9c;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .radio.active {
    outline: 2px solid #005a9c;
    outline-offset: 2px;
  }
</style>
</head>

<body>

<div
  role="radiogroup"
  aria-labelledby="group_label"
  tabindex="0"
  aria-activedescendant="radio-a"
  id="wcag-group"
>
  <h1 id="group_label" class="group-heading">
    WCAG Compliance Level
  </h1>

  <div id="radio-a" role="radio" aria-checked="true" class="radio active">
    <span class="radio-ui" aria-hidden="true"></span>
    WCAG A
  </div>

  <div id="radio-aa" role="radio" aria-checked="false" class="radio">
    <span class="radio-ui" aria-hidden="true"></span>
    WCAG AA
  </div>

  <div id="radio-aaa" role="radio" aria-checked="false" class="radio">
    <span class="radio-ui" aria-hidden="true"></span>
    WCAG AAA
  </div>
</div>

<div>Thanks for learning</div>

<script>
'use strict';

const group = document.getElementById('wcag-group');
const radios = Array.from(group.querySelectorAll('[role="radio"]'));

let activeIndex = 0;

function updateActive(index, select = false) {
  radios.forEach((radio, i) => {
    radio.classList.toggle('active', i === index);
    if (select) {
      radio.setAttribute('aria-checked', i === index ? 'true' : 'false');
    }
  });

  group.setAttribute('aria-activedescendant', radios[index].id);
  activeIndex = index;
}

group.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowDown':
    case 'ArrowRight':
      updateActive((activeIndex + 1) % radios.length);
      e.preventDefault();
      break;

    case 'ArrowUp':
    case 'ArrowLeft':
      updateActive(
        (activeIndex - 1 + radios.length) % radios.length
      );
      e.preventDefault();
      break;

    case ' ':
    case 'Enter':
      updateActive(activeIndex, true);
      e.preventDefault();
      break;
  }
});

group.addEventListener('click', e => {
  const index = radios.indexOf(e.target.closest('[role="radio"]'));
  if (index !== -1) {
    updateActive(index, true);
    group.focus();
  }
});
</script>

</body>
</html>
